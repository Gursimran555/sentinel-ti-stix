id: 3ec9ee08-b002-4789-853f-e98f92a17f91
name: Password spraying from a single IP (Entra ID)
description: |
  'One source IP failing with "invalid username or password" (50126) against many
  different accounts in an hour. Written to close a gap found on the workspace's MITRE
  ATT&CK page: no active rule covered T1110.003.'
severity: Medium
requiredDataConnectors:
  - connectorId: AzureActiveDirectory
    dataTypes:
      - SigninLogs
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CredentialAccess
relevantTechniques:
  - T1110.003
query: |
  let min_accounts = 10;
  SigninLogs
  | where TimeGenerated >= ago(1h)
  | where isnotempty(IPAddress)
  | summarize FailedAccounts = dcountif(UserPrincipalName, ResultType == "50126"),
              SucceededAccounts = dcountif(UserPrincipalName, ResultType == "0"),
              Attempts = countif(ResultType == "50126"),
              SampleAccounts = make_set_if(UserPrincipalName, ResultType == "50126", 20),
              Apps = make_set(AppDisplayName, 10),
              FirstSeen = min(TimeGenerated), LastSeen = max(TimeGenerated)
      by IPAddress
  | where FailedAccounts >= min_accounts
  // An IP that also logs in successfully to many accounts is often a shared egress
  // (VPN, proxy). Kept, but visible for triage.
  | extend SuccessRatio = round(1.0 * SucceededAccounts / (FailedAccounts + SucceededAccounts), 2)
  | order by FailedAccounts desc
entityMappings:
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: IPAddress
version: 1.0.0
kind: Scheduled
