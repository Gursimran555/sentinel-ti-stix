id: 9d931bcc-ba0e-4e30-a9d0-bf431ddbd04a
name: TI (STIX) - Endpoint connection to active IP indicator
description: |
  'Matches active, current IP indicators against outbound connections recorded by
  Defender for Endpoint (DeviceNetworkEvents.RemoteIP).'
severity: Medium
requiredDataConnectors:
  - connectorId: ThreatIntelligence
    dataTypes:
      - ThreatIntelIndicators
  - connectorId: ThreatIntelligenceTaxii
    dataTypes:
      - ThreatIntelIndicators
  - connectorId: MicrosoftDefenderThreatIntelligence
    dataTypes:
      - ThreatIntelIndicators
  - connectorId: MicrosoftThreatProtection
    dataTypes:
      - DeviceNetworkEvents
queryFrequency: 1h
queryPeriod: 14d
triggerOperator: gt
triggerThreshold: 0
tactics:
  - CommandAndControl
relevantTechniques:
  - T1071
query: |
  let ioc_lookBack = 14d;
  let missing_confidence_as = 50;
  let min_confidence = 0;
  let TI = materialize(ThreatIntelIndicators
      | where TimeGenerated >= ago(ioc_lookBack)
      | summarize arg_max(TimeGenerated, *) by Id
      | where coalesce(IsDeleted, false) == false
      | where coalesce(Revoked, false) == false
      | where IsActive == true
      | where isnull(ValidUntil) or ValidUntil > now()
      | extend ConfidenceMissing = isnull(Confidence)
      | extend EffectiveConfidence = iff(ConfidenceMissing, missing_confidence_as, toint(Confidence))
      | where EffectiveConfidence >= min_confidence
      | extend IndicatorType = case(
            ObservableKey in ("ipv4-addr:value", "ipv6-addr:value",
                              "network-traffic:src_ref.value", "network-traffic:dst_ref.value"), "ip",
            ObservableKey == "domain-name:value", "domain",
            ObservableKey == "url:value", "url",
            "other")
      | extend Value = iff(IndicatorType in ("ip", "domain"), tolower(ObservableValue), ObservableValue)
      | extend TI_Name = tostring(Data.name), TI_Description = tostring(Data.description),
               TI_ThreatType = tostring(Data.indicator_types[0]), TI_TLP = tostring(AdditionalFields.TLPLevel)
      | project TI_Id = Id, IndicatorType, Value, EffectiveConfidence, ConfidenceMissing, TI_Source = SourceSystem,
                TI_Name, TI_Description, TI_ThreatType, TI_TLP, ValidUntil);
  let dt_lookBack = 1h;
  let Conns = DeviceNetworkEvents
      | where TimeGenerated >= ago(dt_lookBack)
      | where isnotempty(RemoteIP)
      | extend IPKey = tolower(RemoteIP)
      | project ConnTime = TimeGenerated, DeviceId, DeviceName, RemoteIP, RemotePort, RemoteUrl,
                InitiatingProcessFileName, InitiatingProcessCommandLine, InitiatingProcessAccountName, IPKey;
  TI
  | where IndicatorType == "ip"
  | join kind=inner (Conns) on $left.Value == $right.IPKey
  | where ConnTime < ValidUntil or isnull(ValidUntil)
  | summarize arg_max(ConnTime, *) by TI_Id, DeviceId
  | project ConnTime, DeviceName, DeviceId, RemoteIP, RemotePort, RemoteUrl, InitiatingProcessFileName,
            InitiatingProcessCommandLine, InitiatingProcessAccountName, EffectiveConfidence,
            ConfidenceMissing, TI_Source, TI_ThreatType, TI_Name, TI_Description, TI_Id
entityMappings:
  - entityType: Host
    fieldMappings:
      - identifier: HostName
        columnName: DeviceName
  - entityType: IP
    fieldMappings:
      - identifier: Address
        columnName: RemoteIP
version: 1.0.0
kind: Scheduled
